---
- name: Configure Apache server
  hosts: apache
  become: true

  tasks:
    - name: Install Apache
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Start and enable Apache
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

    - name: Create test web page
      ansible.builtin.copy:
        content: |
          <html>
          <head>
            <title>Ansible Apache Server</title>
          </head>
          <body>
            <h1>Hello from Metro College!</h1>
            <p>Apache was configured using Ansible.</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: apache
        group: apache
        mode: '0644'


- name: Configure MySQL server
  hosts: mysql
  become: true

  tasks:
    - name: Install MySQL server
      ansible.builtin.dnf:
        name: mariadb105-server
        state: present

    - name: Start and enable MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true
